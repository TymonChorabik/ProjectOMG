# Minimal Roblox globals for offline selene runs (the full "roblox" std needs a network fetch).
# CI / local dev with internet access can switch selene.toml back to std = "roblox".
base: luau
name: roblox_lite
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  Instance: { any: true }
  Vector3: { any: true }
  Vector2: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Enum: { any: true }
  TweenInfo: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  Random: { any: true }
  RaycastParams: { any: true }
  BrickColor: { any: true }
  PhysicalProperties: { any: true }
  task: { any: true }
  typeof: { any: true }
  warn: { any: true }
  tick: { any: true }
  time: { any: true }
  delay: { any: true }
  spawn: { any: true }
  wait: { any: true }
  DateTime: { any: true }
  Font: { any: true }
